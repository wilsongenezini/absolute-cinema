<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Absolute Cinema 🎬</title>
    <meta
      name="description"
      content="Filmes com sessão legendada nos cinemas de Três Lagoas, Andradina e Araçatuba, com retrospecto de Três Lagoas"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>"
    />
    <link
      rel="preload"
      href="./fonts/bebas-neue-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="stage">
      <h1 class="title">Absolute Cinema</h1>
      <p class="subtitle" id="subtitle">Sessões legendadas dos cinemas monitorados</p>
      <div class="button-area">
        <div class="actions">
          <button id="fetch-btn" type="button" class="cinema-btn">
            Ver filmes legendados
          </button>
          <button id="history-btn" type="button" class="cinema-btn secondary">
            Ver retrospecto
          </button>
        </div>
        <p id="history-note" class="subtitle history-note" hidden>
          Histórico de sessões legendadas a partir do dia 28 de outubro de 2026
        </p>
      </div>
      <section id="results" class="results" aria-live="polite"></section>
      <footer class="footer">Criado por Wilson Genezini</footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
