<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Absolute Cinema 🎬</title>
    <meta name="description" content="Filmes com sessão legendada no Cinépolis Três Lagoas" />
    <link rel="icon" href="data:🎬" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="stage">
      <h1 class="title">Absolute Cinema</h1>
      <p class="subtitle" id="subtitle">Sessões legendadas dos cinemas monitorados</p>
      <div class="actions">
        <button id="fetch-btn" type="button" class="cinema-btn">
          Ver filmes legendados
        </button>
        <div class="history-action">
          <button id="history-btn" type="button" class="cinema-btn secondary">
            Ver retrospecto
          </button>
          <p id="history-note" class="subtitle history-note" hidden>
            Histórico de sessões legendadas a partir do dia 28 de outubro de 2026
          </p>
        </div>
      </div>
      <section id="results" class="results" aria-live="polite"></section>
      <footer class="footer">Criado por Wilson Genezini</footer>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
